[platformio]
default_envs = m5stack-atom   ; 引数なしの pio run / VSCodeのビルドはこちら

[env:m5stack-atom]
platform = espressif32@6.10.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
monitor_encoding = UTF-8
board_build.partitions = huge_app.csv
lib_deps =
    ;https://github.com/MinteliaShip/servoICS.git#Dev
    https://github.com/aed3/PS4-esp32.git
    https://github.com/hideakitai/ArduinoEigen#v0.3.2

build_flags = 
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=4096 ; loopタスクのスタックサイズ削減（8KB -> 4KB）
    -DCONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST=0 ; PSRAM検索のオーバーヘッド回避
    -std=gnu++17
    -ffunction-sections                   ; 未使用関数のリンク時削減準備
    -fdata-sections                      ; 未使用変数のリンク時削減準備
    -Wl,--gc-sections                    ; 未使用セクションの自動削除（SRAM/Flash双方を最適化）

build_unflags = -std=gnu++11

; 無印ESP32（IMUなし）でPCアプリの動作確認をする用。IMUとPS4の待ちを飛ばす。
; ビルド: pio run -e esp32dev
[env:esp32dev]
extends = env:m5stack-atom
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_encoding = UTF-8
board_build.partitions = huge_app.csv
build_flags =
    ${env:m5stack-atom.build_flags}
    -DSKIP_IMU
    -DSKIP_PS4
build_unflags = -std=gnu++11